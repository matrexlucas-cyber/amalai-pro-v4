
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. تثبيت مكتبات المشروع
      - name: Install dependencies
        run: npm install

      # 5. التأكد من وجود إعداد Capacitor
      - name: Check Capacitor configuration
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      # 6. إنشاء منصة Android
      - name: Add Android platform
        run: npx cap add android

      # 7. مزامنة ملفات التطبيق
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. بناء APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. رفع APK كملف قابل للتنزيل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amalai-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
